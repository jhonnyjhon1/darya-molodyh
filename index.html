<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" media="all">
    <link rel="stylesheet" href="css/mobile.css" media="screen and (min-width: 360px)">
    <link rel="stylesheet" href="css/tablet.css" media="screen and (min-width: 768px)">
    <link rel="stylesheet" href="css/desktop.css" media="screen and (min-width: 1240px)">
    <link rel="shortcut icon" href="img/psy.png" type="image/x-icon">
    <title>Дарья Молодых</title>
</head>

<body>
    <div class="alert">
        <div class="alert_text">
            
        </div>
        <button class="cross">&cross;</button> 
    </div>

    <main>
        <div class="up">
            <div class="logo">Darya <span>Molodyh</span> </div>
            <nav class="menu_nav">
                <button class="profile">Обо мне</button>
                <button class="project">Проекты</button>
                <button class="contacts">Контакты</button>
            </nav>
        </div>
        <div class="content_title">
            <img src="img/flower.png" alt="flower">
            <h1 class="title">Преподаватель <br> <span> и психолог</span> по призванию</h1>
        </div>
        <div class="content_img">

        </div>
        <div class="content_work">
            <div class="work">
                <div class="work_item"><button class="link-1">ВидеоВизитка</button>
                    <video class="video-1" controls>
                        <source src="img/Vizitka.mp4">
                    </video>
                </div>
                <hr>
                <div class="work_item"><button class="link-2">Мультфильм</button>
                    <video class="video-2" controls>
                        <source src="img/Multfilm.mp4">
                    </video>
                </div>
                <hr>
                <div class="work_item"><button class="link-3">Комикс</button>
                    <img class="video-3" src="img/komiks.jpg" alt="komiks">
                </div>
            </div>
        </div>
        <div class="content_desc">
            <img src="img/star.png" alt="star">
            <p class="desc">
                Проект «Баланс тела и головы» – это моя попытка создать тёплое, безопасное пространство, 
                где можно научиться прислушиваться к себе без страха и стыда
            </p>
        </div>
        <div class="content_contact">
            <div class="contact_up">
                <p class="quest">Остались вопросы</p>
                <button class="contacts_arrow">&#8599;</button>
            </div>
            <p class="contact_title">Напишите мне</p>
        </div>

        <div class="content_link">
            <a href="#">ВКонтакте</a>
            <a href="#">Макс</a>
            <a href="#">Instagram</a>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>

</html>
